          maxLength: 100
        budget_kes_per_meal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProfileDietUpdate:
      type: object
      description: Replaces the user's full diet tag list.
      properties:
        diet_tags:
          type: array
          items:
            type: string
            maxLength: 100
          description: List of engine dietary tag slugs (e.g. 'vegetarian', 'nut-free').
    PatchedSaveRecipe:
      type: object
      description: Input for saving a recipe.
      properties:
        dish_id:
          type: string
          maxLength: 36
        dish_slug:
          type: string
          maxLength: 200
        collection_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          default: ''
    PatchedShoppingItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ingredient_id:
          type: string
          readOnly: true
        ingredient_slug:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        quantity_note:
          type: string
          maxLength: 200
        checked:
          type: boolean
        price_estimate_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
    Plan:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        price_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        features: {}
      required:
      - code
      - name
    PlanCodeEnum:
      enum:
      - plus
      type: string
      description: '* `plus` - plus'
    PlatformEnum:
      enum:
      - android
      - ios
      - web
      type: string
      description: |-
        * `android` - android
        * `ios` - ios
        * `web` - web
    Profile:
      type: object
      properties:
        household_size:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        region_slug:
          type: string
          maxLength: 100
        budget_kes_per_meal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - updated_at
    ProfileDiet:
      type: object
      properties:
        diet_tag_slug:
          type: string
          maxLength: 100
        source:
          $ref: '#/components/schemas/SourceEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - diet_tag_slug
    Register:
      type: object
      description: 'Registration: email + username + password.'
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          maxLength: 50
          minLength: 3
        password:
          type: string
          writeOnly: true
          minLength: 8
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: en
        terms_version:
          type: string
          default: 2026-10
      required:
      - email
      - password
      - username
    ResendVerification:
      type: object
      description: Request a new verification email.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResolveRequest:
      type: object
      description: Input for POST /v1/resolve/.
      properties:
        tokens:
          type: array
          items:
            type: string
            maxLength: 200
          description: Free-text ingredient tokens to resolve (e.g. 'nyanya', 'unga').
          maxItems: 30
          minItems: 1
        lang:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: en
      required:
      - tokens
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        dish_id:
          type: string
          maxLength: 36
        dish_slug:
          type: string
          maxLength: 200
        stars:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        text:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - dish_id
      - dish_slug
      - id
      - stars
      - status
    ReviewStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    SaveRecipe:
      type: object
      description: Input for saving a recipe.
      properties:
        dish_id:
          type: string
          maxLength: 36
        dish_slug:
          type: string
          maxLength: 200
        collection_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          default: ''
      required:
      - dish_id
      - dish_slug
    SavedRecipe:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        dish_id:
          type: string
          maxLength: 36
        dish_slug:
          type: string
          maxLength: 200
        dataset_version:
          type: string
          readOnly: true
        collection:
          type: string
          format: uuid
          nullable: true
        collection_name:
          type: string
          readOnly: true
          nullable: true
        note:
          type: string
        saved_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - collection_name
      - dataset_version
      - dish_id
      - dish_slug
      - id
      - saved_at
    SearchRequest:
      type: object
      description: Input for POST /v1/search/.
      properties:
        ingredients:
          type: array
          items:
            type: string
            maxLength: 200
          description: Ingredient names or slugs. Your pantry is always included automatically.
          maxItems: 30
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: strict
          description: |-
            strict: only exact/can_make results. explore: also includes 'almost' results (1-2 missing ingredients).

            * `strict` - strict
            * `explore` - explore
        lang:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: en
        limit:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
        meal_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MealTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        exclude:
          type: array
          items:
            type: string
            maxLength: 200
          description: Ingredient slugs to exclude from results.
    ShoppingItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ingredient_id:
          type: string
          readOnly: true
        ingredient_slug:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        quantity_note:
          type: string
          maxLength: 200
        checked:
          type: boolean
        price_estimate_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - display_name
      - id
      - ingredient_id
      - ingredient_slug
    ShoppingList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        plan:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 200
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - updated_at
    SourceEnum:
      enum:
      - user_set
      - allergen
      type: string
      description: |-
        * `user_set` - User Set
        * `allergen` - Allergen
    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        title_en:
          type: string
          maxLength: 300
        title_sw:
          type: string
          maxLength: 300
        body_en:
          type: string
        body_sw:
          type: string
        region_slugs:
          type: string
          description: Comma-separated engine region slugs (e.g. 'mombasa,kilifi,lamu').
          maxLength: 500
        region_slug_list:
          type: array
          items:
            type: string
          readOnly: true
        author:
          type: string
          maxLength: 200
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - body_en
      - id
      - region_slug_list
      - slug
      - title_en
    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        payload: {}
        status:
          allOf:
          - $ref: '#/components/schemas/SubmissionStatusEnum'
          readOnly: true
        engine_submission_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - engine_submission_id
      - id
      - payload
      - reason
      - status
      - updated_at
    SubmissionStatusEnum:
      enum:
      - draft
      - sent
      - in_review
      - accepted
      - rejected
      type: string
      description: |-
        * `draft` - Draft
        * `sent` - Sent to Engine
        * `in_review` - In Review
        * `accepted` - Accepted
        * `rejected` - Rejected
    Subscribe:
      type: object
      description: Input for POST /v1/subscribe/.
      properties:
        plan_code:
          allOf:
          - $ref: '#/components/schemas/PlanCodeEnum'
          default: plus
    Subscription:
      type: object
      properties:
        plan_code:
          type: string
        plan_name:
          type: string
        status:
          type: string
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
        renews_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
      required:
      - cancelled_at
      - plan_code
      - plan_name
      - renews_at
      - status
      - trial_ends_at
    SyncPush:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Change'
          maxItems: 500
      required:
      - changes
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenResponse:
      type: object
      description: Shape of the token response after login.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    User:
      type: object
      description: Read-only representation of the current user.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/UserLanguageEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/UserStatusEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - email_verified
      - id
      - language
      - status
      - username
    UserLanguageEnum:
      enum:
      - en
      - sw
      type: string
      description: |-
        * `en` - English
        * `sw` - Swahili
    UserStatusEnum:
      enum:
      - active
      - suspended
      - deleted
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `deleted` - Deleted
    _Device:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        push_token:
          type: string
          default: ''
      required:
      - platform
    _DeviceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
        push_token:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - platform
      - push_token
    _LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
