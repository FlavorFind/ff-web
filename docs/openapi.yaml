          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        data:
          readOnly: true
          nullable: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
