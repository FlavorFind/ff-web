openapi: 3.0.3
info:
  title: Flavor Find Consumer API
  version: 1.0.0
  description: |-
    The Flavor Find consumer backend. Serves the website and Android app. Owns accounts, pantries, meal plans, saved recipes, subscriptions. Food data comes from the Recipe Engine.

    **Allergen disclaimer:** Allergen and dietary information is provided for informational purposes only. Always confirm with the kitchen before ordering.
  contact:
    email: api@flavorfind.co.ke
  license:
    name: Proprietary
paths:
  /v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Revoke the refresh token — effectively logs the user out.
      summary: Logout
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Create a new account with email, username, and password. A verification
        email is sent automatically. Login works immediately — email verification
        is not required to use the app.
      summary: Register
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /v1/auth/resend-verification/:
    post:
      operationId: v1_auth_resend_verification_create
      description: POST /v1/auth/resend-verification/ — send a fresh verification
        email.
      summary: Resend verification email
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerification'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
  /v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      description: Submit the token from the verification email to confirm the email
        address.
      summary: Verify email address
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerify'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /v1/budget/suggest/:
    post:
      operationId: v1_budget_suggest_create
      description: Returns recipes whose estimated cost per serving is within the
        given budget. Cost estimates come from the engine and are always labelled
        as estimates. Diet and allergen exclusions from your profile are always applied.
        Requires Plus subscription.
      summary: Budget mode recipe suggestions
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetSuggest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BudgetSuggest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BudgetSuggest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/cooked/:
    get:
      operationId: v1_cooked_list
      description: List and log cooked dishes.
      summary: List cooking history
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CookLog'
          description: ''
    post:
      operationId: v1_cooked_create
      description: List and log cooked dishes.
      summary: Log a cooked dish
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogCook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogCook'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookLog'
          description: ''
  /v1/dishes/{slug}/:
    get:
      operationId: v1_dishes_retrieve
      description: "Fetch full dish information from the engine. Cached per dataset
        version. \n\n**Allergen information is for guidance only. Always confirm with
        the kitchen before ordering.**"
      summary: Dish detail
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/dishes/{slug}/reviews/:
    get:
      operationId: v1_dishes_reviews_list
      description: List and create reviews for a dish.
      summary: List approved reviews for a dish
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          description: ''
    post:
      operationId: v1_dishes_reviews_create
      description: Submit a star rating and review for a dish. Queued for moderation.
      summary: Submit a review
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReview'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Returns the health status of the consumer API.
      summary: Health check
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/ingredients/:
    get:
      operationId: v1_ingredients_retrieve
      description: Fuzzy ingredient search for the autocomplete input. Cached 10 minutes.
      summary: Ingredient autocomplete
      parameters:
      - in: query
        name: lang
        schema:
          enum:
          - en
          - sw
          type: string
          default: en
          minLength: 1
        description: |-
          * `en` - en
          * `sw` - sw
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 200
          minLength: 1
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/me/:
    get:
      operationId: v1_me_retrieve
      description: Current user's details.
      summary: Get current user
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /v1/me/delete/:
    delete:
      operationId: v1_me_delete_destroy
      description: Soft-deletes the account immediately. All personal data is purged
        after a 35-day grace period.
      summary: Delete account
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/me/devices/:
    get:
      operationId: v1_me_devices_list
      description: Register a device for push notifications and sync tracking.
      summary: List user's devices
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/_DeviceResponse'
          description: ''
    post:
      operationId: v1_me_devices_create
      description: Register a device for push notifications and sync tracking.
      summary: Register a device
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_Device'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_Device'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_Device'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_DeviceResponse'
          description: ''
  /v1/me/devices/{device_id}/:
    delete:
      operationId: v1_me_devices_destroy
      description: Remove a registered device (remote logout).
      summary: Remove a device
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/me/diet/:
    get:
      operationId: v1_me_diet_list
      description: GET and PATCH the current user's diet tags.
      summary: Get diet tags
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileDiet'
          description: ''
    patch:
      operationId: v1_me_diet_partial_update
      description: Replaces the full set of diet tags. Allergen tags (source=allergen)
        are always included on engine search calls. **Allergen information is for
        guidance only. Always confirm with the kitchen.**
      summary: Replace diet tags
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileDietUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileDietUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileDietUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileDiet'
          description: ''
  /v1/me/export/:
    get:
      operationId: v1_me_export_retrieve
      description: 'Returns a JSON dump of all data the backend holds for the current
        user: profile, diet tags, pantry, saved recipes, cook log, meal plans, submissions,
        and consent records.'
      summary: Export user data
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/me/profile/:
    get:
      operationId: v1_me_profile_retrieve
      description: GET and PATCH the current user's profile.
      summary: Get profile
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: v1_me_profile_partial_update
      description: GET and PATCH the current user's profile.
      summary: Update profile
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /v1/meta/version/:
    get:
      operationId: v1_meta_version_retrieve
      description: Returns the consumer backend version and the current engine dataset
        version. The dataset_version changes when food data is updated in the engine.
      summary: API and dataset version
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/notifications/:
    get:
      operationId: v1_notifications_list
      description: Returns the most recent 50 in-app notifications for the authenticated
        user.
      summary: List notifications
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /v1/notifications/{notification_id}/read/:
    post:
      operationId: v1_notifications_read_create
      description: POST /v1/notifications/<id>/read/ — mark a notification as read.
      summary: Mark notification as read
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /v1/notifications/preferences/:
    get:
      operationId: v1_notifications_preferences_retrieve
      description: GET/PATCH /v1/notifications/preferences/ — notification preferences.
      summary: Get notification preferences
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
    patch:
      operationId: v1_notifications_preferences_partial_update
      description: GET/PATCH /v1/notifications/preferences/ — notification preferences.
      summary: Update notification preferences
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreference'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreference'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreference'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
  /v1/pantry/:
    get:
      operationId: v1_pantry_list
      description: Returns all ingredients in the current user's pantry.
      summary: List pantry items
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PantryItem'
          description: ''
    post:
      operationId: v1_pantry_create
      description: Add an ingredient to the pantry. Use /v1/ingredients/ to resolve
        the ingredient_id and ingredient_slug from the engine first.
      summary: Add item to pantry
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPantryItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddPantryItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddPantryItem'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItem'
          description: ''
  /v1/pantry/{item_id}/:
    delete:
      operationId: v1_pantry_destroy
      description: Delete a single pantry item.
      summary: Remove item from pantry
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/paystack/webhook/:
    post:
      operationId: v1_paystack_webhook_create
      description: Paystack event webhook. Verified by HMAC-SHA512 signature. Processes
        charge.success events to activate subscriptions.
      summary: Paystack payment webhook
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/plans/:
    get:
      operationId: v1_plans_list
      description: Returns Free and Plus plan details.
      summary: List billing plans
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
  /v1/plans/{plan_id}/shopping-list/:
    post:
      operationId: v1_plans_shopping_list_create
      description: Calls the engine's missing endpoint for each dish in the plan and
        generates a deduplicated shopping list. Requires Plus.
      summary: Generate shopping list from meal plan
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
          description: ''
  /v1/plans/{week}/:
    get:
      operationId: v1_plans_retrieve
      description: 'Week format: YYYY-Www (e.g. 2026-W44). Requires Plus subscription.'
      summary: Get meal plan for a week
      parameters:
      - in: path
        name: week
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
          description: ''
    put:
      operationId: v1_plans_update
      description: Replaces all entries for the week. Partial updates not supported
        — send the full plan. Requires Plus.
      summary: Set meal plan for a week
      parameters:
      - in: path
        name: week
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MealPlanWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MealPlanWrite'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
          description: ''
  /v1/regions/:
    get:
      operationId: v1_regions_retrieve
      description: Returns all Kenyan counties and regions from the engine. Cached
        24 hours.
      summary: List regions (counties)
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/resolve/:
    post:
      operationId: v1_resolve_create
      description: Resolve free-text ingredient names to engine ingredient IDs. Handles
        Swahili, Sheng, misspellings, and aliases. If a token is ambiguous (e.g. 'unga'
        could be maize flour or wheat flour), the response includes choices — show
        them to the user, never guess.
      summary: Resolve ingredient tokens
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /v1/saved/:
    get:
      operationId: v1_saved_list
      description: 'List and save recipes. Free tier: max 20. Plus: unlimited.'
      summary: List saved recipes
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
