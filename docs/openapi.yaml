components:
  schemas:
    AddPantryItem:
      type: object
      description: Add an ingredient to the pantry by providing engine ingredient
        details.
      properties:
        ingredient_id:
          type: string
          maxLength: 36
        ingredient_slug:
          type: string
          maxLength: 200
        display_name:
          type: string
          maxLength: 200
        expires_on:
          type: string
          format: date
          nullable: true
      required:
      - display_name
      - ingredient_id
      - ingredient_slug
    BudgetSuggest:
      type: object
      properties:
        budget_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Maximum cost per serving in KES (estimate only).
        servings:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: strict
        lang:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: en
        limit:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
      required:
      - budget_kes
    Change:
      type: object
      description: A single change from the client.
      properties:
        change_id:
          type: string
          format: uuid
        changed_at:
          type: string
          format: date-time
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        entity_id:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/OperationEnum'
        payload:
          type: object
          additionalProperties: {}
      required:
      - change_id
      - changed_at
      - entity_id
      - entity_type
      - operation
    ChannelEnum:
      enum:
      - push
      - email
      - in_app
      type: string
      description: |-
        * `push` - Push
        * `email` - Email
        * `in_app` - In-App
    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    CookLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        dish_id:
          type: string
          maxLength: 36
        dish_slug:
          type: string
          maxLength: 200
        cooked_at:
          type: string
          format: date-time
          readOnly: true
        rating:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        note:
          type: string
      required:
      - cooked_at
      - dish_id
      - dish_slug
      - id
    CreateReview:
      type: object
      description: Input for POST /v1/dishes/<slug>/reviews/.
      properties:
        stars:
          type: integer
          maximum: 5
          minimum: 1
        text:
          type: string
          default: ''
      required:
      - stars
    CreateSubmission:
      type: object
      description: Input for POST /v1/submissions/.
      properties:
        name_en:
          type: string
          maxLength: 300
        name_sw:
          type: string
          default: ''
          maxLength: 300
        description:
          type: string
        ingredients:
          type: array
          items: {}
          maxItems: 50
          minItems: 1
        steps:
          type: array
          items:
            type: string
          maxItems: 30
          minItems: 1
        meal_type:
          allOf:
          - $ref: '#/components/schemas/MealTypeEnum'
          default: any
        region_slug:
          type: string
          default: ''
          maxLength: 100
        notes:
          type: string
          default: ''
      required:
      - description
      - ingredients
      - name_en
      - steps
    CustomTokenObtainPair:
      type: object
      description: Add user language to the JWT payload.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    DayEnum:
      enum:
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
      - sun
      type: string
      description: |-
        * `mon` - Monday
        * `tue` - Tuesday
        * `wed` - Wednesday
        * `thu` - Thursday
        * `fri` - Friday
        * `sat` - Saturday
        * `sun` - Sunday
    EmailVerify:
      type: object
      description: Verify an email address using the token from the verification email.
      properties:
        token:
          type: string
      required:
      - token
    EntityTypeEnum:
      enum:
      - pantry_item
      - saved_recipe
      - cook_log
      - meal_plan_entry
      - shopping_item
      type: string
      description: |-
        * `pantry_item` - pantry_item
        * `saved_recipe` - saved_recipe
        * `cook_log` - cook_log
        * `meal_plan_entry` - meal_plan_entry
        * `shopping_item` - shopping_item
    LanguageEnum:
      enum:
      - en
      - sw
      type: string
      description: |-
        * `en` - en
        * `sw` - sw
    LogCook:
      type: object
      description: Input for logging a cooked dish.
      properties:
        dish_id:
          type: string
          maxLength: 36
        dish_slug:
          type: string
          maxLength: 200
        rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        note:
          type: string
          default: ''
      required:
      - dish_id
      - dish_slug
    MealPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        week_start:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MealPlanEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - entries
      - id
      - updated_at
      - week_start
    MealPlanEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        day:
          $ref: '#/components/schemas/DayEnum'
        meal_type:
          $ref: '#/components/schemas/MealPlanEntryMealTypeEnum'
        dish_id:
          type: string
          maxLength: 36
        dish_slug:
          type: string
          maxLength: 200
        servings:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        note:
          type: string
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - day
      - dish_id
      - dish_slug
      - id
      - meal_type
    MealPlanEntryMealTypeEnum:
      enum:
      - breakfast
      - lunch
      - dinner
      - snack
      type: string
      description: |-
        * `breakfast` - Breakfast
        * `lunch` - Lunch
        * `dinner` - Dinner
        * `snack` - Snack
    MealPlanWrite:
      type: object
      description: Input for PUT /v1/plans/<week>/.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MealPlanEntry'
